<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="signed-out">
  <section id="login-screen">
    <form id="login-form" class="login-card">
      <h1>Inventory</h1>
      <p id="login-intro" class="muted">Sign in to continue.</p>
      <label>Username <input name="username" autocomplete="username" autocapitalize="none" required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <label id="confirm-row" hidden>Repeat password <input name="confirm" type="password" autocomplete="new-password"></label>
      <p class="error" hidden></p>
      <button type="submit" class="primary">Sign in</button>
    </form>
  </section>

  <header>
    <div class="brand">
      <h1>Inventory</h1>
      <button id="scan-btn" class="primary" title="Scan or type a label code">Scan</button>
      <button id="account-btn" title="Account, users and backup"></button>
    </div>
    <div class="stats">
      <div><span id="stat-items">0</span><label>Parts</label></div>
      <div><span id="stat-units">0</span><label>Units</label></div>
      <div><span id="stat-value">$0.00</span><label>Stock value</label></div>
      <div><span id="stat-jobs">0</span><label>Open jobs</label></div>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-view="parts">Parts</button>
    <button role="tab" data-view="jobs">Jobs</button>
    <button role="tab" data-view="locations">Locations</button>
    <button role="tab" data-view="history">History</button>
  </nav>

  <main>
    <div id="message" role="status" hidden></div>

    <section id="view-parts" class="view">
      <div class="toolbar">
        <input class="search" id="parts-search" type="search" placeholder="Search P/N, description or location…" autocomplete="off">
        <select id="category-filter" aria-label="Category"></select>
        <select id="location-filter" aria-label="Location"></select>
        <button id="add-part" class="primary">+ Add part</button>
        <button id="label-parts">Print labels</button>
        <a id="export-parts" class="button" href="/api/export.csv">Export CSV</a>
        <label class="button">Import CSV<input id="import-file" type="file" accept=".csv,text/csv" hidden></label>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="thumb-col"></th>
              <th data-sort="part_number">P/N</th>
              <th data-sort="description">Description</th>
              <th data-sort="category">Category</th>
              <th>Locations</th>
              <th data-sort="quantity" class="num">Qty</th>
              <th data-sort="unit_value" class="num">Unit value</th>
              <th data-sort="total_value" class="num">Total value</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="parts-rows"></tbody>
        </table>
        <p class="empty" id="parts-empty" hidden></p>
      </div>
    </section>

    <section id="view-jobs" class="view" hidden>
      <div class="toolbar">
        <input class="search" id="jobs-search" type="search" placeholder="Search job number or description…" autocomplete="off">
        <select id="jobs-status" aria-label="Status">
          <option value="open">Open jobs</option>
          <option value="closed">Closed jobs</option>
          <option value="">All jobs</option>
        </select>
        <button id="add-job" class="primary">+ New job</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Job</th><th>Description</th><th>Status</th>
              <th class="num">Parts booked</th><th class="num">Value</th><th>Created</th>
            </tr>
          </thead>
          <tbody id="jobs-rows"></tbody>
        </table>
        <p class="empty" id="jobs-empty" hidden></p>
      </div>
    </section>

    <section id="view-locations" class="view" hidden>
      <div class="toolbar">
        <button id="add-location" class="primary">+ Add location</button>
        <button id="label-locations">Print labels</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Location</th><th>Code</th><th>Notes</th><th class="num">Parts</th>
              <th class="num">Units</th><th class="num">Value</th><th></th>
            </tr>
          </thead>
          <tbody id="locations-rows"></tbody>
        </table>
        <p class="empty" id="locations-empty" hidden></p>
      </div>
    </section>

    <section id="view-history" class="view" hidden>
      <div class="toolbar">
        <input class="search" id="history-search" type="search" placeholder="Search P/N, job, location or note…" autocomplete="off">
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>When</th><th>Action</th><th>P/N</th><th>Location</th><th>Job</th>
              <th class="num">Qty</th><th class="num">Value</th><th>Note</th><th>By</th>
            </tr>
          </thead>
          <tbody id="history-rows"></tbody>
        </table>
        <p class="empty" id="history-empty" hidden></p>
      </div>
    </section>
  </main>

  <!-- Part / job details; built by app.js -->
  <dialog id="detail-dialog" class="wide"></dialog>
  <!-- Forms (add, edit, book out, …); built by app.js, opens on top of the details -->
  <dialog id="form-dialog"></dialog>

  <datalist id="dl-locations"></datalist>
  <datalist id="dl-jobs"></datalist>
  <datalist id="dl-parts"></datalist>
  <datalist id="dl-categories"></datalist>
  <!-- Filled with labels just before printing -->
  <div id="print-area"></div>
  <input id="image-file" type="file" accept="image/*" hidden>

  <script src="vendor/qrcode.js"></script>
  <script src="labels.js"></script>
  <script src="app.js"></script>
</body>
</html>
